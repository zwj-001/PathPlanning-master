      });
      if (!wasOpen) {
        card.classList.add("open");
        let detail = card.querySelector(".day-detail");
        if (!detail) {
          card.insertAdjacentHTML("beforeend", detailMarkup(day));
          detail = card.querySelector(".day-detail");
        }
        if (detail) detail.style.display = "block";
      }
    });
  });

  const filterButtons = [...document.querySelectorAll(".segmented button")];
  const filterValues = ["all", "west", "together"];
  filterButtons.forEach((button, index) => button.addEventListener("click", () => {
    const filter = filterValues[index] || "all";
    filterButtons.forEach((item) => item.classList.remove("active"));
    button.classList.add("active");
    cards.forEach((card) => { card.style.display = filter === "all" || card.dataset.stage === filter ? "" : "none"; });
  }));

  const scrollToId = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
  const navIds = ["overview", "itinerary", "scenery", "hotels", "checklist"];
  document.querySelectorAll(".desktop-nav button").forEach((button, index) => button.addEventListener("click", () => scrollToId(navIds[index])));
  document.querySelector(".brand")?.addEventListener("click", () => scrollToId("top"));
  const heroButtons = document.querySelectorAll(".hero-actions button");
  heroButtons[0]?.addEventListener("click", () => scrollToId("itinerary"));
  heroButtons[1]?.addEventListener("click", () => scrollToId("checklist"));
  document.querySelector(".scroll-cue")?.addEventListener("click", () => scrollToId("overview"));
  const bottomButtons = document.querySelectorAll(".mobile-bottom-nav button");
  ["itinerary", "hotels", "checklist"].forEach((id, index) => bottomButtons[index]?.addEventListener("click", () => scrollToId(id)));

  const menuButton = document.querySelector(".menu-button");
  menuButton?.addEventListener("click", () => {
    let menu = document.querySelector(".mobile-nav");
    if (!menu) {
      menu = document.createElement("nav");
      menu.className = "mobile-nav";
      menu.innerHTML = ["总览", "日程", "风景", "住宿", "清单"].map((label, index) => `<button data-id="${navIds[index]}">${label}</button>`).join("");
      document.querySelector(".topbar")?.appendChild(menu);
      menu.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => { scrollToId(button.dataset.id); menu.style.display = "none"; }));
    } else {
      menu.style.display = menu.style.display === "none" ? "flex" : "none";
    }
  });

  const labels = [...document.querySelectorAll(".check-group label")];
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem("xinjiang-roadbook-checks") || "[]"); } catch {}
  const updateProgress = () => {
    const checked = labels.filter((label) => label.querySelector("input")?.checked);
    const counter = document.querySelector(".check-progress strong");
    const bar = document.querySelector(".progress-track span");
    if (counter) counter.textContent = `${checked.length}/${labels.length}`;
    if (bar) bar.style.width = `${labels.length ? checked.length / labels.length * 100 : 0}%`;
    localStorage.setItem("xinjiang-roadbook-checks", JSON.stringify(checked.map((label) => label.querySelector("span:last-child")?.textContent?.trim()).filter(Boolean)));
  };
  labels.forEach((label) => {
    const input = label.querySelector("input");
    const item = label.querySelector("span:last-child")?.textContent?.trim();
    if (input && item && saved.includes(item)) input.checked = true;
    const sync = () => {
      label.classList.toggle("done", Boolean(input?.checked));
      const box = label.querySelector(".fake-check");
      if (box) box.textContent = input?.checked ? "✓" : "";
    };
    sync();
    input?.addEventListener("change", () => { sync(); updateProgress(); });
  });
  updateProgress();
})();
</script></body></html>
